# Vigia de pasta da biblioteca do ConsertosPro para o ZimaOS.
#
# O codigo fica em HDD4/ConsertosPro-watcher (com o arquivo .env) e as pastas
# de trabalho ficam ao lado. "/DATA/raid" e o caminho do volume compartilhado
# como "raid" no ZimaOS (no app Arquivos aparece como ZimaOS-HD/raid, e
# ZimaOS-HD = /DATA). Se mudar, troque so esse comeco nas 4 linhas de "volumes".
name: consertospro-watcher
services:
  watcher:
    image: node:22-alpine
    container_name: consertospro-watcher
    restart: unless-stopped
    working_dir: /app
    # O .env e lido de dentro da pasta montada em /app: o ZimaOS instala a partir
    # de uma copia do compose em /tmp, entao "env_file: .env" nao o encontra.
    command: sh -c "npm install --omit=dev --no-audit --no-fund && node --env-file=/app/.env src/watcher.mjs"
    environment:
      TZ: Asia/Tokyo
    volumes:
      - "/DATA/raid/Servidor/HDD4/ConsertosPro-watcher:/app"
      - "/DATA/raid/Servidor/HDD4/Enviar para o ConsertosPro:/inbox"
      - "/DATA/raid/Servidor/HDD4/Enviar para o ConsertosPro - Enviados:/enviados"
      - "/DATA/raid/Servidor/HDD4/Enviar para o ConsertosPro - Erros:/erros"
